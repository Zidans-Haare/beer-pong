name: Deploy auf Server

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Unit Tests
        run: npm test

      - name: Playwright Browser installieren
        run: npx playwright install chromium --with-deps

      - name: E2E Tests
        env:
          E2E_BASE_URL: https://bier.olomek.com
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        # rate-limit.spec.ts ausgeschlossen — testet neuen Code der erst nach Deploy verfügbar ist
        run: npx playwright test e2e/auth.spec.ts e2e/navigation.spec.ts e2e/images.spec.ts e2e/tournaments.spec.ts e2e/players.spec.ts e2e/stats.spec.ts
        # Wenn E2E_BASE_URL nicht gesetzt ist, startet playwright.config.ts einen lokalen Dev-Server

      - name: Test-Report hochladen (bei Fehler)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/beer-pong

            # Maintenance-Modus aktivieren
            # maintenance-msg.txt: JSON-Info für die Maintenance-Seite
            echo '{"msg":"Update wird eingespielt…","start":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","end":"'"$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)"'"}' > public/maintenance-msg.txt
            # maintenance.on: nginx-Flag → gibt 503 zurück, zeigt maintenance.html
            touch public/maintenance.on

            # App stoppen
            pm2 stop beer-pong || true

            # Code + Deps aktualisieren
            git pull origin main
            npm ci --omit=dev

            # Build
            npm run build

            # Standalone: public/ und static/ müssen manuell kopiert werden
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            # maintenance.on darf nicht im standalone landen — sonst bleibt Maintenance ewig an
            rm -f .next/standalone/public/maintenance.on .next/standalone/public/maintenance-msg.txt

            # App starten
            pm2 start beer-pong

            # Maintenance-Modus deaktivieren — nginx proxied wieder normal
            # maintenance.html pollt '/' und leitet Nutzer automatisch weiter
            rm -f public/maintenance.on public/maintenance-msg.txt

            echo "Deploy erfolgreich!"
