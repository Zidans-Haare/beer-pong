name: Deploy auf Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: Unit Tests
        run: npm test

      - name: Playwright Browser installieren
        run: npx playwright install chromium --with-deps

      - name: E2E Tests (gegen Produktion — Smoke Test)
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        # rate-limit.spec.ts ausgeschlossen — testet neuen Code der erst nach Deploy verfügbar ist
        run: npx playwright test e2e/auth.spec.ts e2e/navigation.spec.ts e2e/images.spec.ts e2e/tournaments.spec.ts e2e/players.spec.ts e2e/stats.spec.ts
        # Wenn E2E_BASE_URL nicht gesetzt ist, startet playwright.config.ts einen lokalen Dev-Server
        continue-on-error: true

      - name: Test-Report hochladen (bei Fehler)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/beer-pong

            # Aufräumen falls vorheriger Deploy abgebrochen wurde
            rm -f public/maintenance.on public/maintenance-msg.txt

            # Backup des laufenden Standalone-Builds (Rollback bei Fehler)
            if [ -d ".next/standalone" ]; then
              rm -rf .next/standalone.bak
              cp -r .next/standalone .next/standalone.bak
            fi

            # Maintenance immer deaktivieren und App immer starten — auch bei Fehler
            cleanup() {
              local exit_code=$?
              rm -f public/maintenance.on public/maintenance-msg.txt
              if [ $exit_code -ne 0 ] && [ -d ".next/standalone.bak" ]; then
                echo "Build fehlgeschlagen — Rollback auf vorherigen Build"
                rm -rf .next/standalone
                mv .next/standalone.bak .next/standalone
              fi
              set -a; [ -f .env ] && . .env; set +a
              pm2 restart beer-pong --update-env || true
              pm2 save
            }
            trap cleanup EXIT

            # Maintenance-Modus aktivieren (erst Flag, dann Msg nach git pull)
            touch public/maintenance.on

            # App stoppen (sicher während npm ci läuft)
            pm2 stop beer-pong || true

            # Code + Deps aktualisieren
            git pull origin main

            # Maintenance-Msg mit aktuellem Commit-Namen schreiben
            COMMIT_MSG=$(git log -1 --pretty=%s)
            DEPLOY_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            DEPLOY_END=$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)
            echo '{"msg":"Automatisches Update: '"$COMMIT_MSG"'","start":"'"$DEPLOY_START"'","end":"'"$DEPLOY_END"'"}' > public/maintenance-msg.txt
            npm ci
            npx prisma generate
            npx prisma migrate deploy

            # Build
            npm run build

            # maintenance.on darf nicht im standalone landen — sonst bleibt Maintenance ewig an
            rm -f .next/standalone/public/maintenance.on .next/standalone/public/maintenance-msg.txt

            # i18n messages in standalone kopieren (dynamic imports werden nicht automatisch getrackt)
            cp -r messages .next/standalone/messages

            # Backup nicht mehr nötig
            rm -rf .next/standalone.bak

            echo "Deploy erfolgreich!"
