name: Lighthouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance-Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Warten bis Deploy abgeschlossen ist
        if: github.event_name == 'push'
        run: |
          echo "Warte auf gesunden Response von bier.olomek.com..."
          for i in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://bier.olomek.com/ || echo "000")
            echo "Versuch $i: HTTP $status"
            if [ "$status" = "200" ] || [ "$status" = "307" ] || [ "$status" = "302" ] || [ "$status" = "301" ]; then
              echo "Seite erreichbar, starte Lighthouse."
              exit 0
            fi
            sleep 30
          done
          echo "Timeout: Seite nach 20 Minuten nicht erreichbar."
          exit 1

      - name: Lighthouse auf Produktion ausführen
        uses: treosh/lighthouse-ci-action@v12
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
        with:
          configPath: .lighthouserc.js
          uploadArtifacts: true
          serverBaseUrl: 'https://lighthouse.olomek.com'
          serverToken: ${{ secrets.LHCI_TOKEN }}
